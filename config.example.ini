[adler]
# Mit scripts/setup.py wird eine private config.ini mit Zufallscode erstellt.
demo_code = HIER_EIGENEN_LANGEN_ZUFALLSCODE_EINTRAGEN
# Exakt die Browser-Origin, ohne abschließenden Slash. HTTP nur auf Loopback.
public_origin = http://127.0.0.1:5057
# mock ist eine Simulation. compatible nutzt einen echten Dialog-Provider.
provider = mock
# Nur nach Datenschutzprüfung und nur mit synthetischen Testeingaben aktivieren.
external_approved = false
# Exakter OpenAI-kompatibler Chat-Completions-Endpunkt, keine automatische Ergänzung.
endpoint =
model =
# Optional, ausschließlich serverseitig. config.ini niemals veröffentlichen.
api_key =
